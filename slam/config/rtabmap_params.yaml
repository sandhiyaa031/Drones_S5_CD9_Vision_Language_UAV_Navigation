# RTAB-Map 3D Visual SLAM & Occupancy Grid Configuration
rtabmap:
  ros__parameters:
    frame_id: "base_link"
    map_frame_id: "map"
    odom_frame_id: "odom"
    subscribe_depth: true
    subscribe_rgb: true
    subscribe_scan: false
    subscribe_odom_info: true
    approx_sync: true
    queue_size: 10

    # Memory & Database
    Mem/IncrementalMemory: "true"
    Mem/InitWMWithAllNodes: "false"
    Mem/RehearsalSimilarity: "0.45"
    Mem/STMSize: "30"             # Short-Term Memory size
    Mem/RecentWmRatio: "0.2"

    # Feature Extraction (ORB / GFTT / SuperPoint)
    Kp/DetectorStrategy: "6"      # 6 = GFTT/BRIEF, 0 = SURF, 2 = ORB
    Kp/MaxFeatures: "400"
    Vis/MinInliers: "15"
    Vis/InlierDistance: "0.1"

    # Loop Closure & Optimization
    Rtabmap/DetectionRate: "1.0"  # Hz (Run loop closure detection at 1Hz)
    Rtabmap/LoopThr: "0.11"
    Optimizer/Strategy: "1"       # 1 = g2o, 2 = GTSAM
    Optimizer/Robust: "true"

    # 3D Point Cloud and 2D Grid Mapping
    Grid/FromDepth: "true"
    Grid/CellSize: "0.10"         # 10 cm grid resolution
    Grid/RangeMax: "15.0"
    Grid/RayTracing: "true"
    Grid/MaxObstacleHeight: "3.0"
    Grid/MinClusterSize: "5"

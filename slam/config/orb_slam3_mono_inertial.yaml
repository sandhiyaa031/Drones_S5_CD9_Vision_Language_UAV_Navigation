%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV)
Camera1.fx: 525.0
Camera1.fy: 525.0
Camera1.cx: 320.0
Camera1.cy: 240.0

Camera1.k1: 0.0012
Camera1.k2: -0.0025
Camera1.p1: 0.0001
Camera1.p2: 0.0003

# Camera resolution
Camera.width: 640
Camera.height: 480

# Camera frames per second 
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB)
Camera.RGB: 1

#--------------------------------------------------------------------------------------------
# IMU Parameters
#--------------------------------------------------------------------------------------------
# Transformation from camera to IMU (T_c_i)
IMU.T_c_i: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.0, 0.0, 1.0, 0.10,
          -1.0, 0.0, 0.0, 0.00,
          0.0, -1.0, 0.0, 0.05,
          0.0, 0.0, 0.0, 1.0]

# IMU noise specifications
IMU.NoiseGyro: 0.005      # rad/s/sqrt(Hz)
IMU.NoiseAcc: 0.05        # m/s^2/sqrt(Hz)
IMU.GyroWalk: 0.00001     # rad/s^2/sqrt(Hz)
IMU.AccWalk: 0.0001       # m/s^3/sqrt(Hz)
IMU.Frequency: 100.0

#--------------------------------------------------------------------------------------------
# ORB Feature Extractor Parameters
#--------------------------------------------------------------------------------------------
# Number of Features per Image
ORBextractor.nFeatures: 1000

# Scale Factor between levels in the scale pyramid   
ORBextractor.scaleFactor: 1.2

# Number of levels in the scale pyramid 
ORBextractor.nLevels: 8

# Fast threshold
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

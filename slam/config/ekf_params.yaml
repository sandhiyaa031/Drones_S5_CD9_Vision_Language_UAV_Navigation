# Multi-Sensor Extended Kalman Filter (EKF) Parameters
ekf_fusion_node:
  ros__parameters:
    publish_rate_hz: 50.0
    output_frame_id: "odom"
    child_frame_id: "base_link"
    
    # Input Topics
    imu_topic: "/imu/data"
    vo_topic: "/vo/odom"
    rangefinder_topic: "/rangefinder/range"

    # Process Noise Covariances
    accel_noise: 0.05
    gyro_noise: 0.005
    accel_bias_noise: 0.0001
    gyro_bias_noise: 0.00001

    # Measurement Noise Standard Deviations
    vo_position_noise: 0.05     # [m]
    vo_orientation_noise: 0.02  # [rad]
    rangefinder_noise: 0.03     # [m]

    # Outlier Rejection (Mahalanobis Distance Chi-Square Gates)
    enable_outlier_rejection: true
    vo_chi_square_gate: 50.0    # 6-DOF gating threshold
    range_chi_square_gate: 16.0 # 1-DOF (4-sigma)

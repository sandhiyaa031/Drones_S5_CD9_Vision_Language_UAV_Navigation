# ros_gz_bridge configuration for the x500_rescue model in the
# collapsed_building_rescue world (Gazebo -> ROS 2 only).
- ros_topic_name: /camera/image_raw
  gz_topic_name: /world/collapsed_building_rescue/model/x500_rescue_0/link/camera_link/sensor/camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /camera/camera_info
  gz_topic_name: /world/collapsed_building_rescue/model/x500_rescue_0/link/camera_link/sensor/camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
# Upward depth camera: 32FC1, metres.
- ros_topic_name: /depth_up/image_raw
  gz_topic_name: /uav/depth_up/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /depth_up/camera_info
  gz_topic_name: /uav/depth_up/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

# slam_toolbox parameters for the urban disaster zone.
# Same as slam_toolbox_village.yaml except stricter match acceptance and a
# narrower search: the facades repeat (windows every 3 m) and the rubble is
# cluttered; with the village settings a flight in urban_B had its map
# rotated by about 25 degrees by a false match (results/disaster_gazebo/live/
# search_collapsed_block_urban_B_backtrack). PX4's odometry is accurate to
# about 0.15 m, so high acceptance thresholds lose little. A narrower search
# window (correlation_search_space_dimension 0.5, coarse_search_angle_offset
# 0.15) made slam_toolbox crash ("Mapper FATAL ERROR - unable to get pointer
# in probability search", urban_B_strictslam), so those two keep their values.
# slam_toolbox (online, asynchronous) for the village missions.
# 2D pose-graph SLAM on the levelled planar scan; loop closure enabled.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    odom_frame: odom
    map_frame: map
    base_frame: base_level
    scan_topic: /uav/scan
    mode: mapping
    use_sim_time: true
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 1.0
    resolution: 0.25
    min_laser_range: 0.6
    max_laser_range: 29.0
    minimum_time_interval: 0.2
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.3
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 20.0
    link_match_minimum_response_fine: 0.35
    link_scan_maximum_distance: 3.0
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 20
    loop_match_maximum_variance_coarse: 1.0
    loop_match_minimum_response_coarse: 0.6
    loop_match_minimum_response_fine: 0.75
    correlation_search_space_dimension: 1.0
    correlation_search_space_resolution: 0.02
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 1.0
    angle_variance_penalty: 2.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
